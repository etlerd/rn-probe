<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ransom Notes</title>
<style>
  :root { --bg:#f3efe6; --fg:#1b1a17; --muted:#6b675d; --card:#fffdf7; --line:#cfc8b8; --accent:#b3261e; --ok:#1b7f3b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c1b19; --fg:#f2eee4; --muted:#a39d8f; --card:#262522; --line:#47443d; --accent:#ff8b82; --ok:#5fd081; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  [hidden] { display:none !important; }
  button { font:inherit; color:inherit; }
  .pad { padding: 16px; max-width: 640px; margin: 0 auto; }
  h1 { font-size: 26px; margin: 8px 0; }
  input[type=text] { width:100%; padding:12px; font-size:18px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--fg); }
  .big { width:100%; padding:14px; font-size:19px; font-weight:700; border:0; border-radius:12px; background:var(--accent); color:#fff; margin-top:10px; }
  .big:disabled { opacity:.4; }
  .muted { color:var(--muted); }
  .err { color:var(--accent); font-weight:600; }
  #banner { position:sticky; top:0; z-index:20; background:#8a5a00; color:#fff; text-align:center; padding:6px; font-size:14px; }

  /* play screen */
  #top { position:sticky; top:0; z-index:10; background:var(--bg); border-bottom:1px solid var(--line); padding:8px 12px 8px; }
  #banner:not([hidden]) ~ main #top { top:30px; }
  #head { display:flex; justify-content:space-between; align-items:baseline; }
  #roundNo { font-weight:700; color:var(--muted); }
  #timer { font-size:34px; font-weight:800; font-variant-numeric:tabular-nums; }
  #timer.low { color:var(--accent); }
  #prompt { font-size:19px; font-weight:700; line-height:1.25; margin:2px 0 8px; }
  #strip { min-height:62px; border:2px dashed var(--line); border-radius:10px; padding:6px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; background:var(--card); }
  #strip .hint { color:var(--muted); font-size:15px; padding:4px; }
  .chip { padding:8px 10px; border-radius:4px; border:1px solid rgba(0,0,0,.35); color:#111; font-size:18px; box-shadow:0 1px 2px rgba(0,0,0,.25); }
  .chip.sel { outline:3px solid var(--accent); outline-offset:1px; }
  #stripCtl { display:flex; gap:8px; margin-top:6px; }
  #stripCtl button, #tools button { padding:9px 12px; min-height:42px; border:1px solid var(--line); border-radius:8px; background:var(--card); }
  #stripCtl button:disabled { opacity:.35; }
  #tabs { display:flex; gap:6px; overflow-x:auto; padding:10px 12px 2px; -webkit-overflow-scrolling:touch; }
  .tab { white-space:nowrap; padding:9px 12px; border:1px solid var(--line); border-radius:999px; background:var(--card); }
  .tab.on { background:var(--fg); color:var(--bg); border-color:var(--fg); }
  #tools { display:flex; gap:6px; padding:8px 12px; align-items:center; flex-wrap:wrap; }
  #q { flex:1 1 120px; min-width:0; padding:10px; font-size:17px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); }
  #swapBar { margin:0 12px 6px; padding:8px; border:1px solid var(--accent); border-radius:8px; font-size:15px; }
  #swapBar button { margin:6px 6px 0 0; padding:8px 12px; border:1px solid var(--line); border-radius:8px; background:var(--card); }
  #tiles { display:flex; flex-wrap:wrap; gap:7px; padding:6px 12px 110px; }
  .tile { padding:11px 13px; font-size:18px; border-radius:4px; border:1px solid rgba(0,0,0,.35); color:#111; box-shadow:0 1px 2px rgba(0,0,0,.25); }
  .tile:active { transform:scale(.96); }
  .tile.swap { outline:3px dashed var(--accent); outline-offset:1px; }
  #tiles .none { color:var(--muted); padding:8px 2px; }
  #footer { position:fixed; left:0; right:0; bottom:0; z-index:15; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); background:linear-gradient(transparent, var(--bg) 35%); }
  #footer .big { margin:0 auto; display:block; max-width:640px; }
  .checker { background-color:#fff; background-image:linear-gradient(45deg,#ccc 25%,transparent 25%,transparent 75%,#ccc 75%),linear-gradient(45deg,#ccc 25%,transparent 25%,transparent 75%,#ccc 75%); background-size:20px 20px; background-position:0 0,10px 10px; border:1px solid var(--line); margin:12px 0; }
  .checker img { display:block; width:100%; height:auto; }
  .ghost { padding:11px 14px; border:1px solid var(--line); border-radius:10px; background:var(--card); margin:6px 8px 0 0; }

  #modal { position:fixed; inset:0; z-index:30; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; padding:20px; }
  #modal .box { background:var(--card); border-radius:14px; padding:18px; max-width:420px; width:100%; }
  #modal h2 { margin:0 0 6px; font-size:20px; }
  #modal .row { display:flex; gap:10px; margin-top:14px; }
  #modal .row button { flex:1; padding:13px; font-weight:700; border-radius:10px; border:1px solid var(--line); background:var(--card); }
  #modal .row button.go { background:var(--accent); color:#fff; border-color:var(--accent); }
</style>
</head>
<body>
<div id="banner" hidden></div>
<main>
  <section id="sJoin" class="pad" hidden>
    <h1>Ransom Notes</h1>
    <p class="muted">Pick a name the group will recognize.</p>
    <input id="nameIn" type="text" maxlength="16" placeholder="Your name" autocomplete="off" autocapitalize="words">
    <p id="joinMsg" class="err"></p>
    <button id="joinBtn" class="big">Join</button>
  </section>

  <section id="sWait" class="pad" hidden>
    <h1 id="waitTitle"></h1>
    <p id="waitMsg" class="muted"></p>
    <p id="who" class="muted"></p>
  </section>

  <section id="sPlay" hidden>
    <div id="top">
      <div id="head"><div id="roundNo"></div><div id="timer"></div></div>
      <div id="prompt"></div>
      <div id="strip"></div>
      <div id="stripCtl">
        <button id="bLeft" aria-label="Move left">&#9664;</button>
        <button id="bRight" aria-label="Move right">&#9654;</button>
        <button id="bRemove">Remove</button>
        <button id="bClear">Clear all</button>
      </div>
    </div>
    <div id="tabs"></div>
    <div id="tools">
      <input id="q" type="search" placeholder="Search words" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button id="bRandom">Random</button>
      <button id="bAZ">A&ndash;Z</button>
      <button id="bSwap">Swap</button>
    </div>
    <div id="swapBar" hidden></div>
    <div id="tiles"></div>
  </section>

  <section id="sDone" class="pad" hidden>
    <h1 id="doneTitle"></h1>
    <p id="doneMsg" class="muted"></p>
    <div class="checker" id="doneBox" hidden><img id="doneImg" alt="Your note"></div>
    <div id="doneBtns"></div>
  </section>
</main>
<div id="footer" hidden><button id="doneBtn" class="big">Done</button></div>
<div id="modal" hidden><div class="box"><h2 id="mTitle"></h2><div id="mMsg" class="muted"></div><div class="row"><button id="mNo">Keep editing</button><button id="mYes" class="go">Submit</button></div></div></div>

  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage blocked */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } },
};

function fnv(str) { let h = 0x811c9dc5; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); } return h >>> 0; }
function mulberry(seed) {
  let a = seed >>> 0;
  return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function shuffle(arr, r) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
const plain = (w) => w.toLowerCase().replace(/-/g, '');
const cmpWord = (a, b) => { const x = plain(TILES[a].word), y = plain(TILES[b].word); return x < y ? -1 : x > y ? 1 : a < b ? -1 : a > b ? 1 : 0; };

/* ============================================================== dealing */
/** Same token and round always give the same hand, so a refresh or a sleeping phone restores it. */
function dealHand(token, round) {
  const r = mulberry(fnv(token + ':' + round));
  const picked = [], taken = new Set();
  Object.keys(MINS).forEach((c) => {
    const pool = shuffle(BYCAT[c] || [], r);
    for (let i = 0; i < MINS[c] && i < pool.length; i++) { picked.push(pool[i]); taken.add(pool[i]); }
  });
  const rest = shuffle(TILE_IDS.filter((id) => !taken.has(id)), r);
  for (let i = 0; picked.length < HAND_SIZE && i < rest.length; i++) picked.push(rest[i]);
  return picked;
}
/** Replacement tile for a swap: same category, a word not already in the hand when possible. */
function swapOne(token, round, hand, id, n) {
  const c = catOf(TILES[id]);
  const r = mulberry(fnv(token + ':' + round + ':swap:' + n));
  const inHand = new Set(hand);
  const rows = new Set(hand.map((x) => TILES[x].row));
  const pool = (BYCAT[c] || []).filter((x) => !inHand.has(x));
  const fresh = pool.filter((x) => !rows.has(TILES[x].row));
  const use = fresh.length ? fresh : pool;
  return use.length ? use[Math.floor(r() * use.length)] : id;
}

/* ================================================================ server */
let CFG = null;
async function api(action, params, post) {
  if (!CFG) throw new Error('no game settings');
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 30000);
  try {
    let res;
    if (post) {
      res = await fetch(CFG.u, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action, pass: CFG.p }, params || {})), signal: ctl.signal });
    } else {
      const u = new URL(CFG.u);
      u.searchParams.set('action', action); u.searchParams.set('pass', CFG.p);
      res = await fetch(u.toString(), { signal: ctl.signal });
    }
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch (e) { throw new Error('bad reply from server'); }
    if (!data.ok) throw new Error(data.error || 'server error');
    return data;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('timed out');
    throw e;
  } finally { clearTimeout(timer); }
}

/* Clock: offset from the server, using the lowest-latency recent sample. */
const clockSamples = [];
let clockOffset = 0;
function noteClock(t0, t1, serverNow) {
  clockSamples.push({ rtt: t1 - t0, off: serverNow - (t0 + t1) / 2 });
  if (clockSamples.length > 8) clockSamples.shift();
  clockOffset = clockSamples.slice().sort((a, b) => a.rtt - b.rtt)[0].off;
}
const serverTime = () => Date.now() + clockOffset;

function loadCfg() {
  const m = location.hash.match(/[#&]c=([^&]+)/);
  if (m) {
    try {
      const o = JSON.parse(atob(decodeURIComponent(m[1])));
      if (o.u && o.p) store.set('rn_cfg', JSON.stringify({ u: o.u, p: o.p }));
      if (o.u && o.p) return { u: o.u, p: o.p };
    } catch (e) { /* fall through to stored settings */ }
  }
  return loadJson('rn_cfg');
}

function visibleIds() {
  const inNote = new Set(G.note);
  let ids = G.hand.filter((id) => !inNote.has(id));
  if (ui.tab !== 'all') ids = ids.filter((id) => TILES[id].pos === ui.tab || TILES[id].pos2 === ui.tab);
  const q = plain(ui.q.trim());
  if (q) ids = ids.filter((id) => plain(TILES[id].word).indexOf(q) >= 0);
  const ord = ui.order[ui.tab];
  if (ord && ord !== 'az') {
    const rank = new Map(ord.map((id, i) => [id, i]));
    ids.sort((a, b) => ((rank.has(a) ? rank.get(a) : 1e6) - (rank.has(b) ? rank.get(b) : 1e6)) || cmpWord(a, b));
  } else ids.sort(cmpWord);
  return ids;
}
const tileColor = (id) => PALETTE[fnv(id) % PALETTE.length];
function renderPlay() {
  if (!G || !S) return;
  const locked = S.phase !== 'playing' || serverTime() >= S.startedAt + S.durationSec * 1000;
  $('roundNo').textContent = 'Round ' + G.round;
  $('prompt').textContent = S.prompt;

  // note strip
  const strip = $('strip'); strip.innerHTML = '';
  if (!G.note.length) { const h = document.createElement('span'); h.className = 'hint'; h.textContent = 'Tap words below to build your note'; strip.appendChild(h); }
  G.note.forEach((id, i) => {
    const b = document.createElement('button');
    b.className = 'chip' + (i === ui.selNote ? ' sel' : ''); b.textContent = TILES[id].word; b.dataset.i = i;
    b.style.background = tileColor(id); strip.appendChild(b);
  });
  const hasSel = ui.selNote >= 0 && ui.selNote < G.note.length;
  $('bLeft').disabled = !hasSel || ui.selNote === 0;
  $('bRight').disabled = !hasSel || ui.selNote === G.note.length - 1;
  $('bRemove').disabled = !hasSel;
  $('bClear').disabled = !G.note.length;
  $('doneBtn').disabled = !G.note.length || locked;

  // tabs with counts
  const inNote = new Set(G.note);
  const unused = G.hand.filter((id) => !inNote.has(id));
  const tabs = $('tabs'); tabs.innerHTML = '';
  TABS.forEach(([k, label]) => {
    const n = k === 'all' ? unused.length : unused.filter((id) => TILES[id].pos === k || TILES[id].pos2 === k).length;
    const b = document.createElement('button');
    b.className = 'tab' + (ui.tab === k ? ' on' : ''); b.textContent = label + ' (' + n + ')'; b.dataset.k = k; tabs.appendChild(b);
  });

  // swap
  const left = SWAPS_PER_ROUND - G.swapsUsed;
  $('bSwap').textContent = 'Swap (' + left + ')';
  $('bSwap').disabled = left <= 0 || locked;
  const bar = $('swapBar');
  bar.hidden = !ui.swapMode;
  if (ui.swapMode) {
    bar.innerHTML = '';
    const t = document.createElement('div'); t.textContent = 'Tap up to ' + left + ' words to swap for new ones of the same kind. Selected: ' + ui.swapSel.size;
    const go = document.createElement('button'); go.textContent = 'Swap them'; go.id = 'swapGo'; go.disabled = !ui.swapSel.size;
    const no = document.createElement('button'); no.textContent = 'Cancel'; no.id = 'swapNo';
    bar.appendChild(t); bar.appendChild(go); bar.appendChild(no);
  }

  // tiles
  const box = $('tiles'); box.innerHTML = '';
  const ids = visibleIds();
  if (!ids.length) { const n = document.createElement('div'); n.className = 'none'; n.textContent = ui.q ? 'No words match.' : 'No words left in this tab.'; box.appendChild(n); }
  ids.forEach((id) => {
    const b = document.createElement('button');
    b.className = 'tile' + (ui.swapSel.has(id) ? ' swap' : ''); b.textContent = TILES[id].word; b.dataset.id = id; b.style.background = tileColor(id); box.appendChild(b);
  });
}

function onTileTap(id) {
  if (ui.swapMode) {
    const left = SWAPS_PER_ROUND - G.swapsUsed;
    if (ui.swapSel.has(id)) ui.swapSel.delete(id); else if (ui.swapSel.size < left) ui.swapSel.add(id);
  } else {
    if (G.note.length >= MAX_NOTE) return;
    G.note.push(id); ui.selNote = -1; saveG();
  }
  renderPlay();
}
function doSwap() {
  ui.swapSel.forEach((id) => {
    const nid = swapOne(me.token, G.round, G.hand, id, G.swapsUsed);
    G.hand[G.hand.indexOf(id)] = nid; G.swapsUsed++;
  });
  ui.swapSel.clear(); ui.swapMode = false; saveG(); renderPlay();
}

/* =========================================================== note drawing */
const FONT_FAMS = ['Special Elite', 'Bangers', 'Playfair Display', 'Courier Prime', 'Abril Fatface'];
const FONT_SPECS = ['32px "Special Elite"', '32px "Bangers"', '900 32px "Playfair Display"', '700 32px "Courier Prime"', '32px "Abril Fatface"'];
const FONT_CSS = 'https://fonts.googleapis.com/css2?family=Special+Elite&family=Bangers&family=Playfair+Display:wght@900&family=Courier+Prime:wght@700&family=Abril+Fatface&display=swap';
const SCRAPS = ['#f4ecd8', '#fff3b0', '#d9e8f5', '#f7d9d9', '#e3f2d3', '#ffffff', '#f0e0c8', '#222222'];
let fontsPromise = null;
function ensureFonts() {
  if (!fontsPromise) {
    fontsPromise = (async () => {
      let link = $('gf');
      if (!link) {
        link = document.createElement('link'); link.id = 'gf'; link.rel = 'stylesheet'; link.href = FONT_CSS; document.head.appendChild(link);
        await new Promise((r) => { link.onload = r; link.onerror = r; setTimeout(r, 6000); });
      }
      const res = {};
      for (let i = 0; i < FONT_FAMS.length; i++) {
        try { const faces = await document.fonts.load(FONT_SPECS[i]); res[FONT_FAMS[i]] = faces.length > 0 && faces.every((x) => x.status === 'loaded'); }
        catch (e) { res[FONT_FAMS[i]] = false; }
      }
      return res;
    })();
  }
  return fontsPromise;
}

/** Draws the note on a transparent canvas. Same tiles + seed always give the same picture. */
function renderNote(tiles, seed, W, H) {
  W = W || 1920; H = H || 1080;
  const r = mulberry(seed);
  const styles = tiles.map(() => ({ fam: Math.floor(r() * FONT_FAMS.length), sz: 0.8 + r() * 0.5, rot: (r() - 0.5) * 0.14, bg: Math.floor(r() * SCRAPS.length), dy: (r() - 0.5) * 0.25 }));
  const canvas = document.createElement('canvas'); canvas.width = W; canvas.height = H;
  const g = canvas.getContext('2d');
  const isSuf = (t) => /^-/.test(t.word), isPre = (t) => /-$/.test(t.word);
  const joinPrev = tiles.map((t, i) => i > 0 && (isSuf(t) || isPre(tiles[i - 1])));
  const label = (i) => { let s = tiles[i].word; if (joinPrev[i]) s = s.replace(/^-/, ''); if (i < tiles.length - 1 && joinPrev[i + 1]) s = s.replace(/-$/, ''); return s; };

  function layout(scale) {
    const base = H * 0.085 * scale, padX = base * 0.35, padY = base * 0.25, gap = base * 0.2, margin = base * 0.9;
    const items = tiles.map((t, i) => {
      const st = styles[i], fs = Math.round(base * st.sz);
      g.font = fs + 'px "' + FONT_FAMS[st.fam] + '", Georgia, serif';
      const text = label(i);
      return { i, text, fs, fam: FONT_FAMS[st.fam], w: g.measureText(text).width + padX * 2, h: fs + padY * 2, rot: joinPrev[i] ? st.rot * 0.3 : st.rot, bg: st.bg, dy: st.dy * base, join: joinPrev[i] };
    });
    const groups = [];
    items.forEach((it) => { if (it.join && groups.length) groups[groups.length - 1].items.push(it); else groups.push({ items: [it] }); });
    groups.forEach((gr) => { gr.w = gr.items.reduce((a, x) => a + x.w, 0); gr.h = Math.max.apply(null, gr.items.map((x) => x.h)); });
    const rows = []; let cur = { groups: [], w: 0, h: 0 };
    groups.forEach((gr) => {
      const add = gr.w + (cur.groups.length ? gap : 0);
      if (cur.groups.length && cur.w + add > W - 2 * margin) { rows.push(cur); cur = { groups: [], w: 0, h: 0 }; }
      cur.w += gr.w + (cur.groups.length ? gap : 0); cur.groups.push(gr); cur.h = Math.max(cur.h, gr.h);
    });
    if (cur.groups.length) rows.push(cur);
    const height = rows.reduce((a, rw) => a + rw.h, 0) + gap * Math.max(0, rows.length - 1);
    return { rows, height, gap, margin };
  }
  let L = null, used = 1;
  for (const scale of [1, 0.9, 0.8, 0.7, 0.6, 0.5]) { L = layout(scale); used = scale; if (L.height <= H - 2 * L.margin) break; }

  g.clearRect(0, 0, W, H);
  const placed = [];
  let y = (H - L.height) / 2;
  L.rows.forEach((row) => {
    let x = (W - row.w) / 2;
    row.groups.forEach((gr) => {
      gr.items.forEach((it) => {
        const cx = x + it.w / 2, cy = y + row.h / 2 + it.dy;
        g.save(); g.translate(cx, cy); g.rotate(it.rot);
        g.shadowColor = 'rgba(0,0,0,.35)'; g.shadowBlur = 6; g.shadowOffsetY = 3;
        g.fillStyle = SCRAPS[it.bg]; g.fillRect(-it.w / 2, -it.h / 2, it.w, it.h);
        g.shadowColor = 'transparent';
        g.strokeStyle = 'rgba(0,0,0,.25)'; g.lineWidth = 2; g.strokeRect(-it.w / 2, -it.h / 2, it.w, it.h);
        g.fillStyle = SCRAPS[it.bg] === '#222222' ? '#fff' : '#111';
        g.textAlign = 'center'; g.textBaseline = 'middle';
        g.font = it.fs + 'px "' + it.fam + '", Georgia, serif';
        g.fillText(it.text, 0, 0);
        g.restore();
        placed.push({ word: tiles[it.i].word, label: it.text, font: it.fam, size: it.fs, rotation: +it.rot.toFixed(4), scrap: SCRAPS[it.bg], x: Math.round(cx), y: Math.round(cy), w: Math.round(it.w), h: Math.round(it.h) });
        x += it.w;
      });
      x += L.gap;
    });
    y += row.h + L.gap;
  });
  return { canvas, placed, scale: used };
}
const toBlob = (c) => new Promise((res, rej) => c.toBlob((b) => (b ? res(b) : rej(new Error('image creation failed'))), 'image/png'));
const blobToB64 = (b) => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = () => rej(new Error('could not read image')); fr.readAsDataURL(b); });

/* ================================================================ submit */
function showDone(title, msg, canRetry) {
  $('doneTitle').textContent = title; $('doneMsg').textContent = msg || '';
  const btns = $('doneBtns'); btns.innerHTML = '';
  if (lastBlob) {
    const a = document.createElement('button'); a.className = 'ghost'; a.textContent = 'Save image';
    a.onclick = () => { const l = document.createElement('a'); l.href = URL.createObjectURL(lastBlob); l.download = 'my-note.png'; document.body.appendChild(l); l.click(); l.remove(); };
    btns.appendChild(a);
  }
  if (canRetry) {
    const b = document.createElement('button'); b.className = 'ghost'; b.textContent = 'Retry upload';
    b.onclick = () => { G.submitted = false; saveG(); submitNow(G.auto); };
    btns.appendChild(b);
  }
  show('Done');
}
async function submitNow(auto) {
  if (submitting || !G || G.submitted || !G.note.length) return;
  submitting = true; G.auto = !!auto; const round = G.round, prompt = S ? S.prompt : '';
  showDone('Sending your note…', '');
  try {
    const fonts = await ensureFonts();
    const tiles = G.note.map((id) => TILES[id]);
    const seed = fnv(me.token + ':note:' + round);
    const res = renderNote(tiles, seed, 1920, 1080);
    const blob = await toBlob(res.canvas); lastBlob = blob;
    $('doneImg').src = URL.createObjectURL(blob); $('doneBox').hidden = false;
    const b64 = await blobToB64(blob);
    const json = { app: 'ransom-notes', version: 1, round, prompt, player: me.name, submittedAt: new Date().toISOString(), auto: !!auto, canvas: { w: 1920, h: 1080 }, seed, scale: res.scale, fontsLoaded: fonts, words: res.placed };
    let ok = false, lastErr = '';
    for (let i = 0; i < 4 && !ok; i++) {
      try { await api('upload', { name: me.name, token: me.token, round, png: b64, json: JSON.stringify(json) }, true); ok = true; }
      catch (e) { lastErr = e.message; if (/wrong round|not in this game/.test(lastErr)) break; await sleep(1500 * (i + 1)); }
    }
    G.submitted = true; G.uploaded = ok; saveG();
    if (ok) showDone('Submitted', 'Waiting for the next round.');
    else showDone('Upload did not go through', lastErr + '. Tap Retry upload, or save the image and send it to the host.', true);
  } catch (e) {
    G.submitted = true; G.uploaded = false; saveG();
    showDone('Something went wrong', e.message + '. Tap Retry upload.', true);
  } finally { submitting = false; }
}

/* ================================================================== loop */
async function doJoin() {
  try {
    const r = await api('join', { name: me.name, token: me.token }, true);
    me.name = r.name || me.name; saveMe(); joined = true;
  } catch (e) {
    if (/name taken|game full|bad passcode/.test(e.message)) {
      me = null; store.del('rn_me'); joined = false;
      $('joinMsg').textContent = /taken/.test(e.message) ? 'That name is taken. Try another.' : /full/.test(e.message) ? 'The game is full.' : 'Game settings are wrong. Ask the host for a new link.';
      show('Join');
    }
    throw e;
  }
}
function newRound() {
  G = { round: S.round, hand: dealHand(me.token, S.round), note: [], swapsUsed: 0, submitted: false, uploaded: false, auto: false };
  ui.tab = 'all'; ui.q = ''; ui.order = {}; ui.swapMode = false; ui.swapSel.clear(); ui.selNote = -1; $('q').value = '';
  lastBlob = null; $('doneBox').hidden = true; saveG(); screen = '';
}
async function pollOnce() {
  const t0 = Date.now();
  const r = await api('poll');
  noteClock(t0, Date.now(), r.serverNow);
  S = r.state;
  if (joined && me && !S.roster.some((p) => p.name.toLowerCase() === me.name.toLowerCase())) {
    // host started a new game or removed this player: require an explicit rejoin
    me = null; joined = false; G = null; store.del('rn_me'); store.del('rn_game'); screen = '';
    $('joinMsg').textContent = 'The host reset the game or removed you. Enter your name to rejoin.';
    show('Join'); return;
  }
  if (S.round > 0 && (!G || G.round !== S.round)) newRound();
  if (screen === 'Play') renderPlay();
}
async function pollLoop() {
  for (;;) {
    if (me && CFG && !document.hidden) {
      try { if (!joined) await doJoin(); await pollOnce(); setBanner(''); }
      catch (e) { if (me) setBanner('Connection trouble. Retrying…'); }
    }
    await sleep(POLL_MS);
  }
}
let lastPlayRender = 0;
function tick() {
  if (!CFG) return;
  if (!me) { show('Join'); return; }
  if (!S) { showWait('Joining…', ''); return; }
  if (S.round === 0 || !G) { showWait('Waiting for the host', 'The first round has not started yet.'); return; }
  if (G.submitted && screen !== 'Done') { showDone(G.uploaded ? 'Submitted' : 'Upload did not go through', G.uploaded ? 'Waiting for the next round.' : 'Tap Retry upload, or save the image and send it to the host.', !G.uploaded); return; }
  if (G.submitted || submitting) return;
  const end = S.startedAt + S.durationSec * 1000, now = serverTime();
  const playing = S.phase === 'playing' && now < end;
  if (playing) {
    if (screen !== 'Play') { show('Play'); renderPlay(); }
    const rem = Math.max(0, end - now) / 1000;
    const secs = Math.ceil(rem);
    $('timer').textContent = Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0');
    $('timer').className = rem <= 10 ? 'low' : '';
    return;
  }
  if (G.note.length) { submitNow(true); return; }
  showWait('Round ' + G.round + ' is over', 'Waiting for the host to start the next round.');
}

/* ============================================================== wiring */
$('joinBtn').onclick = async () => {
  const name = $('nameIn').value.replace(/\s+/g, ' ').trim();
  if (!name) { $('joinMsg').textContent = 'Type a name first.'; return; }
  me = { name, token: randomToken() }; saveMe(); joined = false; $('joinMsg').textContent = '';
  try { await doJoin(); ensureFonts().catch(() => {}); await pollOnce(); } catch (e) { if (me) $('joinMsg').textContent = 'Could not join: ' + e.message; }
};
$('nameIn').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('joinBtn').click(); });
$('tabs').addEventListener('click', (e) => { const b = e.target.closest('.tab'); if (!b) return; ui.tab = b.dataset.k; renderPlay(); });
$('tiles').addEventListener('click', (e) => { const b = e.target.closest('.tile'); if (b) onTileTap(b.dataset.id); });
$('strip').addEventListener('click', (e) => { const b = e.target.closest('.chip'); if (!b) return; const i = Number(b.dataset.i); ui.selNote = ui.selNote === i ? -1 : i; renderPlay(); });
$('bLeft').onclick = () => { const i = ui.selNote; if (i > 0) { const t = G.note[i]; G.note[i] = G.note[i - 1]; G.note[i - 1] = t; ui.selNote = i - 1; saveG(); renderPlay(); } };
$('bRight').onclick = () => { const i = ui.selNote; if (i >= 0 && i < G.note.length - 1) { const t = G.note[i]; G.note[i] = G.note[i + 1]; G.note[i + 1] = t; ui.selNote = i + 1; saveG(); renderPlay(); } };
$('bRemove').onclick = () => { const i = ui.selNote; if (i >= 0) { G.note.splice(i, 1); ui.selNote = -1; saveG(); renderPlay(); } };
$('bClear').onclick = async () => { if (G.note.length && await confirmDialog('Clear your note?', 'All words go back to your hand.', 'Clear', 'Keep')) { G.note = []; ui.selNote = -1; saveG(); renderPlay(); } };
$('q').addEventListener('input', () => { ui.q = $('q').value; renderPlay(); $('q').focus(); });
$('bRandom').onclick = () => { ui.order[ui.tab] = shuffle(G.hand, Math.random); renderPlay(); };
$('bAZ').onclick = () => { ui.order[ui.tab] = 'az'; renderPlay(); };
$('bSwap').onclick = () => { ui.swapMode = !ui.swapMode; ui.swapSel.clear(); renderPlay(); };
$('swapBar').addEventListener('click', (e) => { if (e.target.id === 'swapGo') doSwap(); if (e.target.id === 'swapNo') { ui.swapMode = false; ui.swapSel.clear(); renderPlay(); } });
$('doneBtn').onclick = async () => {
  if (!G || !G.note.length) return;
  const ok = await confirmDialog('Submit this note?', 'You cannot change it after you submit.', 'Submit', 'Keep editing');
  if (ok) submitNow(false);
};
document.addEventListener('visibilitychange', () => { if (!document.hidden && me && CFG) pollOnce().catch(() => {}); });

CFG = loadCfg();
if (!CFG) { $('waitTitle').textContent = 'Link needed'; $('waitMsg').textContent = 'Open the link the host shared. It carries the game settings.'; show('Wait'); }
else { if (me) $('nameIn').value = me.name; setInterval(tick, 250); pollLoop(); }
</script>
</body>
